name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate extension source files
        run: |
          node --check background.js
          node --check cloak.js
          node --check common.js
          node --check popup.js
          node --input-type=module -e "JSON.parse(await (await import('node:fs/promises')).readFile('manifest.json', 'utf8'))"

      - name: Run tests
        run: node --test tests/ipaddresses.test.mjs

      - name: Build extension package
        run: |
          mkdir -p dist
          zip -r dist/cloudcloak-extension.zip \
            manifest.json \
            background.js \
            cloak.js \
            common.js \
            popup.html \
            popup.js \
            images \
            LICENSE \
            README.md

      - name: Upload extension package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudcloak-extension-pr-${{ github.event.pull_request.number }}
          path: dist/cloudcloak-extension.zip

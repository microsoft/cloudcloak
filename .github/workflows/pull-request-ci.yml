name: Pull Request CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Validate extension source files
        run: |
          node --check background.js
          node --check cloak.js
          node --check common.js
          node --check popup.js
          node --input-type=module -e "JSON.parse(await (await import('node:fs/promises')).readFile('manifest.json', 'utf8'))"

      - name: Run tests
        run: node --test tests/ipaddresses.test.mjs

      - name: Build extension package
        run: |
          mkdir -p dist
          zip -r dist/cloudcloak-extension.zip \
            manifest.json \
            background.js \
            cloak.js \
            common.js \
            popup.html \
            popup.js \
            images \
            LICENSE \
            README.md

      - name: Upload extension package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloudcloak-extension-pr-${{ github.event.pull_request.number }}
          path: dist/cloudcloak-extension.zip
